function getLuckyDirection(s){return LUCKY_DIRECTIONS[s%LUCKY_DIRECTIONS.length];}

function loadDB(){
  document.getElementById('db-stats').textContent='鈴?鏁版嵁搴撳姞杞戒腑...';
  var controller=new AbortController();
  var timeout=setTimeout(function(){controller.abort();document.getElementById('db-stats').textContent='鈿狅笍 鍔犺浇瓒呮椂锛岃妫€鏌ョ綉缁滃悗鍒锋柊椤甸潰';},8000);
  fetch(DATA_URL+'?t='+Date.now(),{signal:controller.signal}).then(function(r){
    clearTimeout(timeout);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    db=data||[];dbLoaded=true;
    document.getElementById('db-stats').textContent='馃搳 鏁版嵁搴撳凡鍔犺浇锛氬叡 '+db.length+' 鏉＄湡瀹炴祴璇曡褰?;
  }).catch(function(e){
    clearTimeout(timeout);
    document.getElementById('db-stats').textContent='鈿狅笍 鍔犺浇澶辫触锛?+e.message+'锛夛紝璇峰埛鏂伴噸璇?;
    dbLoaded=false;
    console.error(e);
  });
}
loadDB();
setInterval(loadDB,60000);

  var container=document.getElementById('search-result');

    return;
  }

  var html='<div class="msg info">馃攳 鎵惧埌 <b>'+matches.length+'</b> 鏉″尮閰嶈褰曪紝璇烽€夋嫨锛?/div><ul class="match-list">';
