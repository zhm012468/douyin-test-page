<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;padding:20px 16px;}
.container{max-width:460px;margin:0 auto;}
h1{text-align:center;font-size:1.2rem;margin:20px 0 4px;}
.sub{text-align:center;color:#888;font-size:0.75rem;margin-bottom:16px;}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px 18px;margin-bottom:16px;}
.input-group{margin-bottom:14px;}
.input-group label{display:block;font-size:0.82rem;color:#aaa;margin-bottom:6px;font-weight:600;}
.input-group input{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#e0e0e0;font-size:1rem;outline:none;}
.input-group input:focus{border-color:#a855f7;}
.btn{width:100%;padding:14px;font-size:1rem;font-weight:700;border:none;border-radius:50px;cursor:pointer;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;letter-spacing:2px;}
.result{display:none;}
.result .header{text-align:center;margin-bottom:14px;}
.result .badge{display:inline-block;padding:4px 12px;border-radius:14px;font-size:0.78rem;background:rgba(168,85,247,0.2);color:#a855f7;margin:3px;}
.result .name-display{font-size:1.4rem;font-weight:800;margin:8px 0;}
.result .tag{display:inline-block;padding:7px 18px;border-radius:20px;font-size:1rem;font-weight:700;background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;}

.result ul li{position:relative;padding:6px 0 6px 20px;font-size:0.85rem;color:#b8b8d0;line-height:1.6;}
.result ul li::before{content:'✦';position:absolute;left:0;color:#a855f7;font-size:0.6rem;top:9px;}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
.tag-item{flex:1;min-width:70px;text-align:center;padding:10px 6px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);}
.tag-item .l{font-size:0.68rem;color:#888;}
.tag-item .v{font-size:0.88rem;font-weight:700;}
.divider{border:0;border-top:1px solid rgba(255,255,255,0.08);margin:14px 0;}
.copy-btn{width:100%;padding:13px;font-size:0.9rem;font-weight:600;border:1px solid rgba(245,158,11,0.3);border-radius:50px;background:rgba(245,158,11,0.1);color:#f59e0b;cursor:pointer;margin-top:10px;letter-spacing:1px;}

.msg.info{background:rgba(6,182,212,0.1);color:#06b6d4;border:1px solid rgba(6,182,212,0.2);}
.match-list{list-style:none;}

.stats{text-align:center;font-size:0.72rem;color:#555;margin:8px 0;}
.footer{text-align:center;font-size:0.7rem;color:#555;margin-top:30px;}

  var h='';

  var b='';

  for(var i=0;i<p.free.length;i++)b+='<li>'+p.free[i]+'</li>';
  b+='</ul>';
  b+='<div class="tags">';

  b+='<div class="tag-item"><div class="l">🔢 幸运数</div><div class="v">'+getLuckyNumber(name,month,day)+'</div></div>';
  b+='<div class="tag-item"><div class="l">🧭 幸运方位</div><div class="v">'+getLuckyDirection(dI)+'</div></div>';
  b+='</div>';
  b+='<hr class="divider">';
  b+='<h3>🔐 深度解读</h3><ul>';
  for(var i=0;i<p.locked.length;i++)b+='<li>'+p.locked[i]+'</li>';
  b+='</ul>';
  b+='<div class="tags">';
  b+='<div class="tag-item"><div class="l">💝 情感运势</div><div class="v">'+loveOpts[lI]+'</div></div>';
  b+='<div class="tag-item"><div class="l">💼 事业运势</div><div class="v">'+careerOpts[caI]+'</div></div>';
  b+='<div class="tag-item"><div class="l">🧘 2026关键词</div><div class="v">'+keywordOpts[kI]+'</div></div>';
  b+='</div>';
  // 掌纹区域
  b+='<hr class="divider">';
  b+='<h3>🔍 掌纹解读</h3>';
  b+='<div style="background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);border-radius:12px;padding:16px;text-align:center;color:var(--text-muted);font-size:0.82rem;">';
  b+='<div style="font-size:32px;margin-bottom:8px;">🖐️</div>';
  b+='<p>未识别手掌 · 请稍后重新尝试</p>';
  b+='<p style="font-size:0.7rem;margin-top:4px;">用户需在测试时上传掌心照片方可获取深度掌纹分析</p>';
  b+='</div>';

  document.getElementById('report-body').innerHTML=b;
  document.getElementById('report').style.display='block';
}

function downloadReport(){
  var header = document.getElementById('report-header');
  var body = document.getElementById('report-body');
  if(!body || document.getElementById('report').style.display==='none'){alert('请先查询用户再下载报告');return;}
  var btn = event.target;
  btn.textContent='⏳ 生成中...';
  btn.disabled=true;
  // 克隆 header + body 完整内容
  var clone = document.createElement('div');
  if(header) clone.appendChild(header.cloneNode(true));
  clone.appendChild(body.cloneNode(true));
  clone.style.padding = '20px';
  clone.style.background = '#0a0a1a';
  clone.style.position = 'absolute';
  clone.style.left = '-9999px';
  clone.style.width = '440px';
  clone.style.textAlign = 'center';
  document.body.appendChild(clone);
  html2canvas(clone,{backgroundColor:'#0a0a1a',scale:2,useCORS:true,logging:false}).then(function(canvas){
    document.body.removeChild(clone);
    canvas.toBlob(function(blob){
      var file = new File([blob], 'report-'+Date.now()+'.png', {type:'image/png'});
      var url = URL.createObjectURL(blob);
      // 手机端：尝试直接分享/保存到相册
      var isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
      if(isMobile && navigator.share && navigator.canShare){
        var shareData = {files:[file], title:'性格测试报告'};
        if(navigator.canShare(shareData)){
          navigator.share(shareData).then(function(){
            btn.textContent='📥 一键下载报告'; btn.disabled=false;
          }).catch(function(){
            // 分享被取消，打开图片让用户长按保存
            var w = window.open(url, '_blank');
            if(w) w.document.title = '长按图片保存到相册';
            btn.textContent='📥 一键下载报告'; btn.disabled=false;
          });
          return;
        }
      }
      // 桌面端或分享不可用：打开新窗口，手机可长按保存
      if(isMobile){
        var w = window.open(url, '_blank');
        if(w){ w.document.title = '长按图片保存到相册'; alert('📱 请长按图片 → 选择"保存到相册"'); }
        else { var a=document.createElement('a'); a.download='report.png'; a.href=url; a.click(); }
      } else {
        var a=document.createElement('a');
        a.download='personality-report-'+Date.now()+'.png';
        a.href=url;
        a.click();
      }
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
      btn.textContent='📥 一键下载报告'; btn.disabled=false;
    },'image/png');
  }).catch(function(e){
    document.body.removeChild(clone);
    btn.textContent='📥 一键下载报告'; btn.disabled=false;
    alert('生成失败，请截图保存');
  });
}

function copyReport(){
  var h=document.getElementById('report-header').innerText;
  var b=document.getElementById('report-body').innerText;
  var txt='═══ 双面人格测试 · 完整报告 ═══\n\n'+h+'\n\n'+b+'\n\n✨ 以上为专属完整版报告，感谢参与测试！';
  var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  alert('✅ 报告已复制！直接粘贴发给对方即可。');
}
