<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>💔 测你的分手概率 Hm1</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;padding:20px 16px}.container{max-width:460px;margin:0 auto}.hero{text-align:center;margin:30px 0 20px}.hero .icon{font-size:56px;animation:float 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.hero h1{font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,#f43e5e,#e11d48,#be123c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:10px}.hero p{color:#888;font-size:0.85rem;margin-top:6px}.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px 18px;margin-bottom:16px}.progress{display:flex;gap:4px;margin-bottom:20px}.progress .dot{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.1)}.progress .dot.done{background:linear-gradient(90deg,#f43e5e,#e11d48)}.qn{font-size:0.75rem;color:#f43e5e;margin-bottom:6px;font-weight:600}.qq{font-size:1.1rem;font-weight:700;margin-bottom:16px;line-height:1.4}.opt{display:block;width:100%;padding:14px 16px;margin-bottom:10px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#e0e0e0;font-size:0.95rem;text-align:left;cursor:pointer;transition:all 0.2s}.opt:active{border-color:#f43e5e;background:rgba(244,62,94,0.12)}.hidden{display:none}.re{font-size:60px;text-align:center;margin-bottom:10px}.rt{display:block;text-align:center;padding:10px 24px;border-radius:25px;font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#f43e5e,#e11d48);color:#fff;margin:10px auto;width:fit-content}.rs{text-align:center;font-size:0.85rem;color:#f43e5e;margin:8px 0}.rd{line-height:1.8;color:#b8b8d0}.lock{margin-top:16px;padding:20px;border-radius:14px;background:rgba(244,62,94,0.05);border:1px dashed rgba(244,62,94,0.2);text-align:center}.li{font-size:44px;margin-bottom:8px}.lock h4{color:#f43e5e;margin-bottom:4px}.lock p{font-size:0.8rem;color:#888;margin-bottom:12px}.ba{display:inline-block;padding:14px 36px;background:linear-gradient(135deg,#f43e5e,#e11d48);color:#fff;border:none;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:1px;animation:pulse 2.5s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(244,62,94,0.3)}50%{box-shadow:0 0 40px rgba(225,29,72,0.5)}}.bs{width:100%;margin-top:14px;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:50px;color:#aaa;font-size:0.9rem;cursor:pointer}.br{width:100%;margin-top:10px;padding:12px;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:50px;color:#666;font-size:0.85rem;cursor:pointer}.foot{text-align:center;font-size:0.7rem;color:#555;margin:20px 0}</style></head>
<body><div class="container">
<div id="p1"><div class="hero"><div class="icon">💔</div><h1>分手概率测试</h1><p>测你的感情牢不牢固</p></div><div class="card" style="text-align:center"><p style="color:#aaa;font-size:0.9rem;margin-bottom:16px">已有 <b style="color:#f43e5e" id="ct">389,672</b> 人完成</p><button onclick="go()" style="width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#f43e5e,#e11d48);color:#fff;border:none;border-radius:50px;cursor:pointer;letter-spacing:2px">💔 测分手概率</button></div><p class="foot">⚠️ 仅供娱乐参考</p></div>
<div id="p2" class="hidden"><div class="progress" id="pb"></div><div class="card"><div class="qn" id="qn"></div><div class="qq" id="qq"></div><div id="qo"></div></div></div>
<div id="p3" class="hidden"><div class="re" id="re"></div><div class="rt" id="rt"></div><div class="rs" id="rs"></div><div class="card"><div class="rd" id="rd"></div></div><div class="lock" id="lk"><div class="li">🔒</div><h4>完整分析已加密</h4><p>观看15秒广告解锁详细报告</p><button class="ba" onclick="un()">🔓 观看广告解锁</button></div><div id="fr" class="hidden"><div class="card" style="border-color:rgba(244,62,94,0.2)"><div id="fc"></div></div></div><button class="bs" onclick="sh()">📤 分享给TA一起测</button><button class="br" onclick="re()">🔄 重新测试</button><p class="foot">⚠️ 仅供娱乐参考</p></div></div>
<script>
var Q=[{q:"你和TA吵架频率？",o:["几乎不吵","偶尔小吵","经常吵架","冷战居多"]},{q:"吵架后谁先低头？",o:["总是我先","TA先","轮流","谁也不理谁"]},{q:"TA有异性闺蜜吗？",o:["没有","有但我不介意","有我很介意","就是那个闺蜜"]},{q:"你们分享手机密码？",o:["互相都知道","我知道TA的","TA知道我的","都不知道"]},{q:"TA父母对你的态度？",o:["很喜欢我","一般般","不太喜欢","还没见过"]},{q:"你们在一起多久了？",o:["3年以上","1-3年","半年到1年","不到半年"]},{q:"TA记得你的生日吗？",o:["每年都记得","偶尔忘记","需要提醒","完全不记得"]},{q:"你们对未来规划？",o:["详细讨论过","大概聊过","各想各的","从没谈过"]},{q:"朋友不看好你们？",o:["大家都祝福","有人不看好","很多人劝分","无所谓"]},{q:"如果TA提分手？",o:["拼命挽回","难过但接受","无所谓","我会先提"]}];
var A=[0,0,0,0,0],N=0;
function d(id){return document.getElementById(id)}
function go(){A=[0,0,0,0,0];N=0;d('p1').className='hidden';d('p3').className='hidden';d('p2').className='';var p=d('pb');p.innerHTML='';for(var i=0;i<10;i++){var e=document.createElement('div');e.className='dot';e.id='d'+i;p.appendChild(e)}nxt();}
function pick(i){A[i]++;N++;if(d('d'+(N-1)))d('d'+(N-1)).classList.add('done');if(N>=10){fin()}else{nxt()}}
function nxt(){var q=Q[N];d('qn').textContent='第 '+(N+1)+'/10 题';d('qq').textContent=q.q;var o=d('qo');o.innerHTML='';for(var i=0;i<4;i++){o.innerHTML+='<button class="opt" onclick="pick('+i+')">'+q.o[i]+'</button>'}}
function fin(){d('p2').className='hidden';d('p3').className='';d('fr').className='hidden';d('lk').className='lock';var m=0,idx=0;for(var i=0;i<5;i++){if(A[i]>m){m=A[i];idx=i}}
var T=[{e:'💍',n:'分手概率：5% 天作之合',s:'安全感 '+Math.round(m/10*100)+'%',t:'恭喜！你们的感情基础坚实，双方都愿意为这段关系付出。你们是少见的互补型情侣——一个屋檐下，彼此成就。保持现在的相处模式，你们的爱情大概率会走向婚姻。'},{e:'💚',n:'分手概率：20% 稳定发展中',s:'稳定感 '+Math.round(m/10*100)+'%',t:'你们的感情处于健康状态。虽有小摩擦但都能妥善解决。需要警惕的是"习惯性忽视"——久了容易把对方的好当成理所当然。偶尔制造惊喜能让你们的感情保鲜。'},{e:'💛',n:'分手概率：45% 需要警惕',s:'警惕感 '+Math.round(m/10*100)+'%',t:'你们的感情有一些隐患需要正视。可能在某些核心价值观上有分歧，或者沟通方式存在问题。建议坐下来认真谈一次——把问题摆在桌面上比暗自消磨要好。及时修复比分手后再后悔强。'},{e:'🧡',n:'分手概率：70% 危险边缘',s:'危险指数 '+Math.round(m/10*100)+'%',t:'你们的感情已经亮起红灯。积累了太多未解决的矛盾，双方都感到疲惫。但70%不是100%——如果两个人都愿意努力，这个数字可以逆转。关键是要真诚面对问题，而不是逃避。'},{e:'💔',n:'分手概率：90% 强扭的瓜不甜',s:'自由指数 '+Math.round(m/10*100)+'%',t:'也许你们已经走到了分岔路口。有时候放手不是失败，而是对双方的成全。如果一段感情带来的是消耗而非滋养，勇敢离开是最好的选择。下一段感情你会更清楚自己需要什么。'}];
var t=T[idx];d('re').textContent=t.e;d('rt').textContent=t.n;d('rs').textContent=t.s;d('rd').textContent=t.t;window.scrollTo(0,0)}
function un(){setTimeout(function(){d('fr').className='';d('lk').className='hidden';var idx=0,m=0;for(var i=0;i<5;i++){if(A[i]>m){m=A[i];idx=i}};var F=['💔 感情深度分析\n\n💍 天作之合\n📍 分手概率：5%\n📍 沟通：★★★★★\n📍 信任：★★★★★\n📍 未来展望：★★★★★\n\n💡 你们是让人羡慕的一对。保持真诚和付出，你们的爱情故事会是别人眼中的童话。\n⭐ 感情评分：98分','💔 感情深度分析\n\n💚 稳定发展\n📍 分手概率：20%\n📍 沟通：★★★★☆\n📍 信任：★★★★☆\n📍 未来展望：★★★★☆\n\n💡 你们的感情基础好。需要注意的是细节维护——小问题不及时解决会变大的。\n⭐ 感情评分：82分','💔 感情深度分析\n\n💛 需要警惕\n📍 分手概率：45%\n📍 沟通：★★★☆☆\n📍 信任：★★★☆☆\n📍 未来展望：★★★☆☆\n\n💡 还有挽救空间。建议约一次认真的对谈，各自写下对方的三个好和三个希望改进的地方。\n⭐ 感情评分：65分','💔 感情深度分析\n\n🧡 危险边缘\n📍 分手概率：70%\n📍 沟通：★★☆☆☆\n📍 信任：★★☆☆☆\n📍 未来展望：★★☆☆☆\n\n💡 你们已经到了需要重大改变的节点。要么一起寻求专业情感咨询，要么理性评估是否继续。\n⭐ 感情评分：45分','💔 感情深度分析\n\n💔 强扭的瓜不甜\n📍 分手概率：90%\n📍 沟通：★☆☆☆☆\n📍 信任：★☆☆☆☆\n📍 未来展望：★☆☆☆☆\n\n💡 放手也是一种爱。不要因为习惯了就勉强留下。结束一段错误的关系，才能为对的人留出位置。\n⭐ 感情评分：20分'];d('fc').innerHTML=F[idx].replace(/\n/g,'<br>')},1500)}
function sh(){if(navigator.share){navigator.share({title:'💔 测你的分手概率',text:'测完心凉了…来测测你们的感情牢不牢固！',url:location.href}).catch(function(){})}else{prompt('复制链接：',location.href)}}
function re(){d('p3').className='hidden';d('p1').className='';window.scrollTo(0,0)}
setInterval(function(){var e=d('ct');if(e){var n=parseInt(e.textContent.replace(/,/g,''))||389000;n+=Math.floor(Math.random()*9)+1;e.textContent=n.toLocaleString()}},6000);
</script></body></html>
