<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎨 AI动漫换脸 Hm1</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;padding:20px 16px}.container{max-width:460px;margin:0 auto}.hero{text-align:center;margin:30px 0 20px}.hero .icon{font-size:56px;animation:float 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.hero h1{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#c084fc,#e879f9,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:10px}.hero p{color:#888;font-size:0.85rem;margin-top:6px}.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px 18px;margin-bottom:16px}.upload{width:100%;height:180px;border:2px dashed rgba(192,132,252,0.3);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;background:rgba(192,132,252,0.03);position:relative;overflow:hidden}.upload:hover{border-color:#c084fc;background:rgba(192,132,252,0.06)}.upload .icon{font-size:48px;opacity:0.6}.upload .txt{margin-top:8px;font-size:0.85rem;color:#888}.upload .sub{font-size:0.7rem;color:#555;margin-top:4px}.upload img{width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0}.upload.has-img{border-style:solid;border-color:rgba(192,132,252,0.5)}.upload.has-img .icon,.upload.has-img .txt,.upload.has-img .sub{display:none}.btn{width:100%;padding:16px;font-size:1.1rem;font-weight:700;color:#fff;border:none;border-radius:50px;cursor:pointer;letter-spacing:2px;margin-top:12px}.btn.gen{background:linear-gradient(135deg,#c084fc,#e879f9)}.btn.gen:disabled{opacity:0.4;cursor:not-allowed}.result{display:none;text-align:center}.result h3{color:#c084fc;margin-bottom:12px}.result img{max-width:100%;border-radius:16px;margin-bottom:12px}.lock{margin-top:16px;padding:20px;border-radius:14px;background:rgba(192,132,252,0.05);border:1px dashed rgba(192,132,252,0.2);text-align:center}.lock .li{font-size:44px;margin-bottom:8px}.lock h4{color:#c084fc;margin-bottom:4px}.lock p{font-size:0.8rem;color:#888;margin-bottom:12px}.ba{display:inline-block;padding:14px 36px;background:linear-gradient(135deg,#c084fc,#e879f9);color:#fff;border:none;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:1px;animation:pulse 2.5s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(192,132,252,0.3)}50%{box-shadow:0 0 40px rgba(232,121,249,0.5)}}.loading{display:none;text-align:center;padding:40px}.loading .spinner{width:48px;height:48px;border:3px solid rgba(192,132,252,0.2);border-top-color:#c084fc;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.foot{text-align:center;font-size:0.7rem;color:#555;margin:20px 0}.bs{width:100%;margin-top:14px;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:50px;color:#aaa;font-size:0.9rem;cursor:pointer}.br{width:100%;margin-top:10px;padding:12px;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:50px;color:#666;font-size:0.85rem;cursor:pointer}</style></head>
<body><div class="container">
<div id="p1">
  <div class="hero"><div class="icon">🎨</div><h1>AI 动漫换脸</h1><p>上传照片秒变动漫主角</p></div>
  <div class="card">
    <div class="upload" id="upload" onclick="document.getElementById('file').click()">
      <span class="icon">📸</span><span class="txt">点击上传照片</span><span class="sub">支持 jpg/png · 正面照效果最佳</span>
      <img id="preview" alt="" style="display:none">
    </div>
    <input type="file" id="file" accept="image/*" style="display:none" onchange="previewImg(event)">
    <button class="btn gen" id="genBtn" onclick="generate()" disabled>🎨 生成动漫头像</button>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div><p style="color:#888">AI 正在生成中...</p></div>
  <div class="result" id="result">
    <h3>✨ 动漫效果</h3>
    <img id="resultImg" alt="">
    <div class="lock" id="lock"><div class="li">🔒</div><h4>高清原图已加密</h4><p>观看15秒广告解锁下载</p><button class="ba" onclick="unlock()">🔓 观看广告解锁</button></div>
    <button class="bs" onclick="sh()">📤 分享给朋友</button>
    <button class="br" onclick="re()">🔄 重新上传</button>
  </div>
  <p class="foot">⚠️ AI 生成效果仅供娱乐</p>
</div></div>
<script>
var imgData=null;
function d(id){return document.getElementById(id)}
function previewImg(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){d('preview').src=ev.target.result;d('preview').style.display='block';d('upload').classList.add('has-img');d('genBtn').disabled=false;imgData=ev.target.result};r.readAsDataURL(f)}
function generate(){
  if(!imgData)return;d('genBtn').disabled=true;d('genBtn').textContent='⏳ 生成中...';d('loading').style.display='block';d('result').style.display='none';
  fetch('http://101.34.75.89:8088/api/cartoon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imgData})}).then(r=>r.json()).then(data=>{
    d('loading').style.display='none';d('result').style.display='block';
    if(data.error){alert('生成失败：'+data.error);d('genBtn').disabled=false;d('genBtn').textContent='🎨 重新生成';return}
    if(data.Data&&data.Data.ImageURL){d('resultImg').src=data.Data.ImageURL}else if(data.Data&&data.Data.ResultImage){d('resultImg').src='data:image/png;base64,'+data.Data.ResultImage}
    d('lock').style.display='block';
  }).catch(e=>{d('loading').style.display='none';d('genBtn').disabled=false;d('genBtn').textContent='🎨 重新生成';alert('生成失败，请检查服务器是否启动')})
}
function unlock(){d('lock').style.display='none';alert('✅ 已解锁！长按图片即可保存到相册')}
function sh(){if(navigator.share){navigator.share({title:'🎨 超好玩AI动漫换脸',text:'上传照片秒变动漫主角！来试试！',url:location.href}).catch(function(){})}}
function re(){d('result').style.display='none';d('preview').style.display='none';d('upload').classList.remove('has-img');d('genBtn').disabled=true;d('genBtn').textContent='🎨 生成动漫头像';imgData=null;d('file').value=''}
</script></body></html>
