var LUCKY_COLORS = ['珊瑚橙','薰衣草紫','薄荷绿','日落金','星空蓝','玫瑰粉','琥珀黄','海洋蓝','火焰红','月光银','森林绿','珊瑚蓝'];
var LUCKY_DIRECTIONS = ['东','南','西','北','东南','西南','东北','西北'];

function getCharSum(s){ var sum=0; for(var i=0;i<s.length;i++) sum+=s.charCodeAt(i); return sum; }
function getZodiac(m,d){ var z=['摩羯座','水瓶座','双鱼座','白羊座','金牛座','双子座','巨蟹座','狮子座','处女座','天秤座','天蝎座','射手座']; var c=[20,19,21,20,21,22,23,23,23,24,23,22]; var idx=m-1; if(d>c[idx]) idx=(idx+1)%12; return z[idx]; }
function getChineseZodiac(y){ var a=['🐭 鼠','🐮 牛','🐯 虎','🐰 兔','🐲 龙','🐍 蛇','🐴 马','🐏 羊','🐵 猴','🐔 鸡','🐶 狗','🐷 猪']; return a[(y-4)%12]; }
function getPersonalityIndex(n,m,d){ return (getCharSum(n)*7+m*13+d*3)%PERSONALITY_DB.length; }
function getVariant(s,m,d,mod){ return (s+m*d+d*3)%mod; }
function getLuckyColor(s){ return LUCKY_COLORS[s%LUCKY_COLORS.length]; }
function getLuckyNumber(n,m,d){ return (getCharSum(n)+m*11+d*7)%9+1; }
function getLuckyDirection(s){ return LUCKY_DIRECTIONS[s%LUCKY_DIRECTIONS.length]; }

function doQuery(){
  var name = document.getElementById('admin-name').value.trim();
  var birthday = document.getElementById('admin-birthday').value;
  if(!name||!birthday){ alert('请填写姓名和出生日期'); return; }

  var parts = birthday.split('-');
  var year = parseInt(parts[0]), month = parseInt(parts[1]), day = parseInt(parts[2]);
  var pIdx = getPersonalityIndex(name,month,day);
  var p = PERSONALITY_DB[pIdx];
  var zodiac = getZodiac(month,day);
  var animal = getChineseZodiac(year);
  var cI = getVariant(pIdx,month,day,LUCKY_COLORS.length);
  var dI = getVariant(pIdx,month+day,day,LUCKY_DIRECTIONS.length);
  var lI = getVariant(pIdx,month,day+3,3);
  var caI = getVariant(pIdx,day,month+5,3);
  var kI = getVariant(pIdx,month+day,day+7,3);
  var loveOpts = [p.love, '灵魂伴侣近在眼前', '旧情复燃的可能'];
  var careerOpts = [p.career, '贵人即将出现', '跳槽最佳时机已到'];
  var keywordOpts = [p.keyword, '吸引力法则', '蜕变'];

  // Header
  var h = '';
  h += '<span class="badge">♈ '+zodiac+'</span> <span class="badge">'+animal+'</span>';
  h += '<div class="name-display">'+name+'</div>';
  h += '<span class="tag">'+p.name+'</span>';
  document.getElementById('report-header').innerHTML = h;

  // Body
  var b = '';
  b += '<h3>🌟 性格画像</h3><ul>';
  for(var i=0;i<p.free.length;i++) b += '<li>'+p.free[i]+'</li>';
  b += '</ul>';
  b += '<div class="tags">';
  b += '<div class="tag-item"><div class="l">🎨 幸运色</div><div class="v">'+getLuckyColor(cI)+'</div></div>';
  b += '<div class="tag-item"><div class="l">🔢 幸运数</div><div class="v">'+getLuckyNumber(name,month,day)+'</div></div>';
  b += '<div class="tag-item"><div class="l">🧭 幸运方位</div><div class="v">'+getLuckyDirection(dI)+'</div></div>';
  b += '</div>';
  b += '<hr class="divider">';
  b += '<h3>🔐 深度解读</h3><ul>';
  for(var i=0;i<p.locked.length;i++) b += '<li>'+p.locked[i]+'</li>';
  b += '</ul>';
  b += '<div class="tags">';
  b += '<div class="tag-item"><div class="l">💝 情感运势</div><div class="v">'+loveOpts[lI]+'</div></div>';
  b += '<div class="tag-item"><div class="l">💼 事业运势</div><div class="v">'+careerOpts[caI]+'</div></div>';
  b += '<div class="tag-item"><div class="l">🧘 2026关键词</div><div class="v">'+keywordOpts[kI]+'</div></div>';
  b += '</div>';
  document.getElementById('report-body').innerHTML = b;
  document.getElementById('result').style.display = 'block';
}

function copyReport(){
  var h = document.getElementById('report-header').innerText;
  var b = document.getElementById('report-body').innerText;
  var txt = '═══ 双面人格测试 · 完整报告 ═══\n\n'+h+'\n\n'+b+'\n\n✨ 以上为专属完整版报告，感谢参与测试！';
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  alert('✅ 报告已复制！直接粘贴发给对方即可。');
}
