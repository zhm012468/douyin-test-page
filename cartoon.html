<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎨 AI动漫换脸 Hm2</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;padding:20px 16px}.c{max-width:460px;margin:0 auto}.hero{text-align:center;margin:30px 0 20px}.hero .i{font-size:56px;animation:f 3s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.hero h1{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#c084fc,#e879f9,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:10px}.hero p{color:#888;font-size:0.85rem;margin-top:6px}.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px 18px;margin-bottom:16px}.up{width:100%;height:180px;border:2px dashed rgba(192,132,252,0.3);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;background:rgba(192,132,252,0.03);position:relative;overflow:hidden}.up:active{border-color:#c084fc;background:rgba(192,132,252,0.06)}.up .ic{font-size:48px;opacity:0.6}.up .tx{margin-top:8px;font-size:0.85rem;color:#888}.up img{width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0}.up.has .ic,.up.has .tx{display:none}.btn{width:100%;padding:16px;font-size:1.1rem;font-weight:700;color:#fff;border:none;border-radius:50px;cursor:pointer;letter-spacing:2px;margin-top:12px}.btn.gen{background:linear-gradient(135deg,#c084fc,#e879f9)}.btn.gen:disabled{opacity:0.4}.res{display:none;text-align:center}.res h3{color:#c084fc;margin-bottom:12px}.res img{max-width:100%;border-radius:16px;margin-bottom:12px}.lock{margin-top:16px;padding:20px;border-radius:14px;background:rgba(192,132,252,0.05);border:1px dashed rgba(192,132,252,0.2);text-align:center}.lock .li{font-size:44px;margin-bottom:8px}.lock h4{color:#c084fc;margin-bottom:4px}.lock p{font-size:0.8rem;color:#888;margin-bottom:12px}.un{display:inline-block;padding:14px 36px;background:linear-gradient(135deg,#c084fc,#e879f9);color:#fff;border:none;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:1px;animation:p 2.5s infinite}@keyframes p{0%,100%{box-shadow:0 0 20px rgba(192,132,252,0.3)}50%{box-shadow:0 0 40px rgba(232,121,249,0.5)}}.load{display:none;text-align:center;padding:40px}.load .sp{width:48px;height:48px;border:3px solid rgba(192,132,252,0.2);border-top-color:#c084fc;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}.foot{text-align:center;font-size:0.7rem;color:#555;margin:20px 0}.bs{width:100%;margin-top:14px;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:50px;color:#aaa;font-size:0.9rem;cursor:pointer}.br{width:100%;margin-top:10px;padding:12px;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:50px;color:#666;font-size:0.85rem;cursor:pointer}</style></head>
<body><div class="c">
<div class="hero"><div class="i">🎨</div><h1>AI 动漫换脸</h1><p>上传照片秒变动漫主角</p></div>
<div class="card">
  <div class="up" id="up" onclick="D('f').click()"><span class="ic">📸</span><span class="tx">点击上传照片</span><img id="pv" alt="" style="display:none"></div>
  <input type="file" id="f" accept="image/*" style="display:none" onchange="P(event)">
  <button class="btn gen" id="gb" onclick="G()" disabled>🎨 生成动漫头像</button>
</div>
<div class="load" id="ld"><div class="sp"></div><p style="color:#888">AI 正在生成中...</p></div>
<div class="res" id="rs">
  <h3>✨ 动漫效果</h3><img id="ri" alt="">
  <div class="lock" id="lk"><div class="li">🔒</div><h4>高清原图已加密</h4><p>观看15秒广告解锁下载</p><button class="un" onclick="U()">🔓 观看广告解锁</button></div>
  <button class="bs" onclick="S()">📤 分享给朋友</button><button class="br" onclick="R()">🔄 重新上传</button>
</div>
<p class="foot">⚠️ AI 生成效果仅供娱乐</p>
</div>
<script>
var I=null;function D(id){return document.getElementById(id)}
function P(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){D('pv').src=ev.target.result;D('pv').style.display='block';D('up').classList.add('has');D('gb').disabled=false;I=ev.target.result};r.readAsDataURL(f)}
function G(){if(!I)return;D('gb').disabled=true;D('gb').textContent='⏳ 生成中...';D('ld').style.display='block';D('rs').style.display='none';
  fetch('/api/cartoon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:I})}).then(function(r){return r.json()}).then(function(d){
    D('ld').style.display='none';D('rs').style.display='block';
    if(d.error){alert('生成失败：'+d.error);D('gb').disabled=false;D('gb').textContent='🎨 重新生成';return}
    D('ri').src=d.result||'data:image/png;base64,'+(d.resultBase64||'');D('lk').style.display='block';
  }).catch(function(e){D('ld').style.display='none';D('gb').disabled=false;D('gb').textContent='🎨 重新生成';alert('网络错误，请重试')})
}
function U(){D('lk').style.display='none';alert('✅ 已解锁！长按图片即可保存')}
function S(){if(navigator.share){navigator.share({title:'🎨 AI动漫换脸',text:'上传照片秒变动漫主角！',url:location.href}).catch(function(){})}}
function R(){D('rs').style.display='none';D('pv').style.display='none';D('up').classList.remove('has');D('gb').disabled=true;D('gb').textContent='🎨 生成动漫头像';I=null;D('f').value=''}
</script></body></html>
