<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🏆 智商挑战 Hm1</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;padding:20px 16px}.container{max-width:460px;margin:0 auto}.hero{text-align:center;margin:30px 0 20px}.hero .icon{font-size:56px;animation:float 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.hero h1{font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,#f59e0b,#ef4444,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:10px}.hero p{color:#888;font-size:0.85rem;margin-top:6px}.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px 18px;margin-bottom:16px}.progress{display:flex;gap:4px;margin-bottom:20px}.progress .dot{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.1)}.progress .dot.done{background:linear-gradient(90deg,#f59e0b,#ef4444)}.qn{font-size:0.75rem;color:#f59e0b;margin-bottom:6px;font-weight:600}.qq{font-size:1.1rem;font-weight:700;margin-bottom:16px;line-height:1.4}.opt{display:block;width:100%;padding:14px 16px;margin-bottom:10px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#e0e0e0;font-size:0.95rem;text-align:left;cursor:pointer;transition:all 0.2s}.opt:active{border-color:#f59e0b;background:rgba(245,158,11,0.12)}.hidden{display:none}.re{font-size:60px;text-align:center;margin-bottom:10px}.rt{display:block;text-align:center;padding:10px 24px;border-radius:25px;font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;margin:10px auto;width:fit-content}.rs{text-align:center;font-size:0.85rem;color:#f59e0b;margin:8px 0}.rd{line-height:1.8;color:#b8b8d0}.lock{margin-top:16px;padding:20px;border-radius:14px;background:rgba(245,158,11,0.05);border:1px dashed rgba(245,158,11,0.2);text-align:center}.li{font-size:44px;margin-bottom:8px}.lock h4{color:#f59e0b;margin-bottom:4px}.lock p{font-size:0.8rem;color:#888;margin-bottom:12px}.ba{display:inline-block;padding:14px 36px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:1px;animation:pulse 2.5s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(245,158,11,0.3)}50%{box-shadow:0 0 40px rgba(239,68,68,0.5)}}.bs{width:100%;margin-top:14px;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:50px;color:#aaa;font-size:0.9rem;cursor:pointer}.br{width:100%;margin-top:10px;padding:12px;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:50px;color:#666;font-size:0.85rem;cursor:pointer}.foot{text-align:center;font-size:0.7rem;color:#555;margin:20px 0}</style></head>
<body><div class="container">
<div id="p1"><div class="hero"><div class="icon">🏆</div><h1>智商挑战</h1><p>10道题测出你的IQ水平</p></div><div class="card" style="text-align:center"><p style="color:#aaa;font-size:0.9rem;margin-bottom:16px">已有 <b style="color:#f59e0b" id="ct">1,247,563</b> 人挑战</p><button onclick="go()" style="width:100%;padding:16px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;border-radius:50px;cursor:pointer;letter-spacing:2px">🏆 挑战智商</button></div><p class="foot">⚠️ 仅供娱乐参考</p></div>
<div id="p2" class="hidden"><div class="progress" id="pb"></div><div class="card"><div class="qn" id="qn"></div><div class="qq" id="qq"></div><div id="qo"></div></div></div>
<div id="p3" class="hidden"><div class="re" id="re"></div><div class="rt" id="rt"></div><div class="rs" id="rs"></div><div class="card"><div class="rd" id="rd"></div></div><div class="lock" id="lk"><div class="li">🔒</div><h4>完整IQ报告已加密</h4><p>观看15秒广告解锁详细分析</p><button class="ba" onclick="un()">🔓 观看广告解锁</button></div><div id="fr" class="hidden"><div class="card" style="border-color:rgba(245,158,11,0.2)"><div id="fc"></div></div></div><button class="bs" onclick="sh()">📤 分享给朋友比一比</button><button class="br" onclick="re()">🔄 重新挑战</button><p class="foot">⚠️ 仅供娱乐参考</p></div></div>
<script>
var Q=[{q:"8, 12, 18, 26, ? 下一个数？",o:["36","34","38","32"]},{q:"如果昨天是明天，今天就是周五。实际上今天是？",o:["周三","周四","周日","周一"]},{q:"所有的A都是B，有些C是A。以下哪个正确？",o:["有些C是B","所有C是B","没有C是B","B都是A"]},{q:"15个苹果分给5个孩子，每人至少一个且数量不同，最多分几个？",o:["5个","6个","4个","7个"]},{q:"下列哪个与其他不同？",o:["钢琴","吉他","笛子","小提琴"]},{q:"3个人3天喝3桶水，9个人9天喝？",o:["27桶","9桶","18桶","81桶"]},{q:"一根绳子剪成2段需要10秒，剪成5段需要？",o:["40秒","50秒","25秒","20秒"]},{q:"某人有17个硬币共0.5元，硬币只有1分和5分。5分有几个？",o:["8个","9个","7个","10个"]},{q:"排队时你前面有7人后面有8人，一共？",o:["16人","15人","14人","17人"]},{q:"A比B大3岁，5年前A的年龄是B的2倍，A现在？",o:["11岁","8岁","13岁","9岁"]}];
var A=[0,0,0,0,0],N=0,score=0;
function d(id){return document.getElementById(id)}
function go(){A=[0,0,0,0,0];N=0;score=0;d('p1').className='hidden';d('p3').className='hidden';d('p2').className='';var p=d('pb');p.innerHTML='';for(var i=0;i<10;i++){var e=document.createElement('div');e.className='dot';e.id='d'+i;p.appendChild(e)}nxt();}
function pick(i){if(i===0)score+=10;N++;if(d('d'+(N-1)))d('d'+(N-1)).classList.add('done');if(N>=10){fin()}else{nxt()}}
function nxt(){var q=Q[N];d('qn').textContent='第 '+(N+1)+'/10 题';d('qq').textContent=q.q;var o=d('qo');o.innerHTML='';for(var i=0;i<4;i++){o.innerHTML+='<button class="opt" onclick="pick('+i+')">'+q.o[i]+'</button>'}}
function fin(){d('p2').className='hidden';d('p3').className='';d('fr').className='hidden';d('lk').className='lock';var lv=score<40?0:score<60?1:score<80?2:score<95?3:4;
var T=[{e:'🤔',n:'IQ：85 需努力',s:'答对 '+score/10+'/10 题',t:'你的逻辑思维还有提升空间。智力不是天生的，多做题、多思考可以锻炼脑力。别灰心——许多伟大的人刚开始也很笨拙，重要的是持续学习和进步。'},{e:'👍',n:'IQ：105 正常水平',s:'答对 '+score/10+'/10 题',t:'你的智商处于平均水平。日常生活中完全够用，工作学习都不成问题。但你还有很大的潜力可以挖掘——多挑战自己不擅长的领域，大脑会越用越灵光。'},{e:'👏',n:'IQ：125 聪明过人',s:'答对 '+score/10+'/10 题',t:'你的智商处于聪明级别。思维敏捷、逻辑清晰，学习新东西非常快。你已经超过了大部分同龄人，在学术或科研领域会有很好的发展。继续保持好奇心。'},{e:'🧠',n:'IQ：140 天才级别',s:'答对 '+score/10+'/10 题',t:'你的智商处于门萨会员级别。拥有超群的逻辑推理能力和数学天赋。在复杂问题面前你总能找到优雅的解法。你注定要在某个专业领域做出非凡的贡献。'},{e:'🌟',n:'IQ：160 爱因斯坦',s:'答对 '+score/10+'/10 题',t:'天呐！你的智商已经接近人类天花板。拥有这种智商的人万里挑一。你的思维方式可能和常人完全不同——你在别人还在理解问题时已经找到了答案。世界等待你去改变。'}];
var t=T[lv];d('re').textContent=t.e;d('rt').textContent=t.n;d('rs').textContent=t.s;d('rd').textContent=t.t;window.scrollTo(0,0)}
function un(){setTimeout(function(){d('fr').className='';d('lk').className='hidden';var lv=score<40?0:score<60?1:score<80?2:score<95?3:4;var F=['🏆 IQ深度分析报告\n\n🤔 IQ 85\n📍 逻辑推理：★★☆☆☆\n📍 数字能力：★★☆☆☆\n📍 空间想象：★★★☆☆\n📍 语言理解：★★★☆☆\n\n💡 你需要在逻辑推理方面多加训练。推荐每天做5道逻辑题，一个月后会有显著提升。\n⭐ 综合评分：65分','🏆 IQ深度分析报告\n\n👍 IQ 105\n📍 逻辑推理：★★★☆☆\n📍 数字能力：★★★☆☆\n📍 空间想象：★★★☆☆\n📍 语言理解：★★★☆☆\n\n💡 你各方面比较均衡，是典型的健康大脑。挑战自己不擅长领域会让你的能力更全面。\n⭐ 综合评分：75分','🏆 IQ深度分析报告\n\n👏 IQ 125\n📍 逻辑推理：★★★★☆\n📍 数字能力：★★★★☆\n📍 空间想象：★★★★☆\n📍 语言理解：★★★★☆\n\n💡 你的智商已经超过85%的人群。建议往STEM领域发展，施展你的逻辑天赋。\n⭐ 综合评分：85分','🏆 IQ深度分析报告\n\n🧠 IQ 140\n📍 逻辑推理：★★★★★\n📍 数字能力：★★★★★\n📍 空间想象：★★★★★\n📍 语言理解：★★★★★\n\n💡 天才级别！你适合科研、数学、物理等需要超高智商的领域。不要浪费你的天赋。\n⭐ 综合评分：95分','🏆 IQ深度分析报告\n\n🌟 IQ 160\n📍 逻辑推理：★★★★★+\n📍 数字能力：★★★★★+\n📍 空间想象：★★★★★+\n📍 语言理解：★★★★★+\n\n💡 万里挑一的天才！你的大脑构造可能异于常人。请务必选择一个能让你的智力充分施展的领域——世界需要你。\n⭐ 综合评分：99分'];d('fc').innerHTML=F[lv].replace(/\n/g,'<br>')},1500)}
function sh(){if(navigator.share){navigator.share({title:'🏆 测测你的智商',text:'我测了125分！来挑战这个智商测试，看看你多少分！',url:location.href}).catch(function(){})}else{prompt('复制链接：',location.href)}}
function re(){d('p3').className='hidden';d('p1').className='';window.scrollTo(0,0)}
setInterval(function(){var e=d('ct');if(e){var n=parseInt(e.textContent.replace(/,/g,''))||1247000;n+=Math.floor(Math.random()*9)+1;e.textContent=n.toLocaleString()}},6000);
</script></body></html>
